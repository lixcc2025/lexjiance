[project]
name = "avengine"
version = "0.6.0"
description = "音视频 AI 生成 / 剪辑痕迹检测引擎（桌面端的检测后台）"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]   # 声音分析；打包时固定版本，见 desktop/build/runtime.json

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["avengine*"]
